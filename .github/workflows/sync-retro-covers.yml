name: Sincronizar portadas retro
on:
  push:
    paths:
      - 'scripts/sync_covers.py'
      - '.github/workflows/sync-retro-covers.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 6 * * *'
permissions:
  contents: write
jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/sync_covers.py
      - name: Guardar portadas nuevas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retro-covers.json assets/retro-covers
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar portadas retro locales"
            git push
          fi
